name: Shared Notification

on:
  workflow_call:
    inputs:
      result:
        required: true
        type: string
      context:
        required: true
        type: string
      job:
        required: false
        type: string
        default: ''
      runner:
        required: false
        type: string
        default: self-hosted
    secrets:
      SLACK_WEBHOOK_URL:
        required: true
      MATTERMOST_CHANNEL_ID:
        required: false
      MATTERMOST_TOKEN:
        required: false
      MATTERMOST_URL:
        required: false
      TAILSCALE_OAUTH_CLIENT_ID:
        required: false
      TAILSCALE_OAUTH_CLIENT_SECRET:
        required: false

permissions: {}

concurrency:
  group: notify-${{ github.workflow }}-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    name: Notification
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sapphire-sh/github-actions

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Prepare
        id: status
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MATTERMOST_TOKEN: ${{ secrets.MATTERMOST_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          RESULT: ${{ inputs.result }}
          CONTEXT: ${{ inputs.context }}
          JOB: ${{ inputs.job }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.event.workflow_run.head_branch || github.ref }}
          REF_NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          EVENT_NAME: ${{ github.event.workflow_run.event || github.event_name }}
          WORKFLOW: ${{ github.event.workflow_run.name || github.workflow }}
          SERVER_URL: ${{ github.server_url }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message }}
          COMMIT_AUTHOR_NAME: ${{ github.event.workflow_run.head_commit.author.name || github.event.head_commit.author.name }}
          COMMIT_AUTHOR_EMAIL: ${{ github.event.workflow_run.head_commit.author.email || github.event.head_commit.author.email }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] && echo "notify_slack=true" >> "$GITHUB_OUTPUT" || echo "notify_slack=false" >> "$GITHUB_OUTPUT"
          [ -n "$MATTERMOST_CHANNEL_ID" ] && [ -n "$MATTERMOST_TOKEN" ] && [ -n "$MATTERMOST_URL" ] && [ -n "$TAILSCALE_OAUTH_CLIENT_ID" ] && [ -n "$TAILSCALE_OAUTH_CLIENT_SECRET" ] && echo "notify_mattermost=true" >> "$GITHUB_OUTPUT" || echo "notify_mattermost=false" >> "$GITHUB_OUTPUT"
          PAYLOAD=$(node .github/scripts/notify-build-payload.js)
          echo "payload<<PAYLOAD_EOF" >> "$GITHUB_OUTPUT"
          echo "$PAYLOAD" >> "$GITHUB_OUTPUT"
          echo "PAYLOAD_EOF" >> "$GITHUB_OUTPUT"

      - name: Send Slack message
        if: steps.status.outputs.notify_slack == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.status.outputs.payload }}

      - name: Connect to Tailscale
        if: steps.status.outputs.notify_mattermost == 'true' && runner.environment == 'github-hosted'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Start Mattermost proxy
        if: steps.status.outputs.notify_mattermost == 'true'
        env:
          MATTERMOST_TOKEN: ${{ secrets.MATTERMOST_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
        run: |
          node .github/scripts/notify-mattermost-proxy.js &
          echo $! > /tmp/mm_proxy.pid
          sleep 1

      - name: Send Mattermost message
        if: steps.status.outputs.notify_mattermost == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: http://127.0.0.1:8765
          webhook-type: incoming-webhook
          payload: ${{ steps.status.outputs.payload }}

      - name: Stop Mattermost proxy
        if: always() && steps.status.outputs.notify_mattermost == 'true'
        run: kill "$(cat /tmp/mm_proxy.pid)" 2>/dev/null || true
