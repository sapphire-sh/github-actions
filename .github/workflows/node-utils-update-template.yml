name: Shared Utils Update

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: ubuntu-latest
      assignee:
        required: false
        type: string
        default: ''
      package_name:
        required: false
        type: string
        default: '@sapphire-sh/utils'
      branch_name:
        required: false
        type: string
        default: chore/sapphire-utils
    secrets:
      PULL_REQUEST_TOKEN:
        required: true

permissions: {}

jobs:
  update:
    uses: sapphire-sh/github-actions/.github/workflows/node-sapphire-package-update-template.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: write
    secrets:
      PULL_REQUEST_TOKEN: ${{ secrets.PULL_REQUEST_TOKEN }}
    with:
      runner: ${{ inputs.runner }}
      assignee: ${{ inputs.assignee }}
      package_name: ${{ inputs.package_name }}
      branch_name: ${{ inputs.branch_name }}
