name: Shared Config Update

on:
  workflow_call:
    inputs:
      run_tests:
        required: false
        type: boolean
        default: false
      runner:
        required: false
        type: string
        default: ubuntu-latest
      rebuild_packages:
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: shared-config-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/github-actions
          path: .github-actions-shared

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The install above keeps lifecycle scripts off for the whole dependency tree. Listing the
      # packages whose install script produces their binding file runs those scripts back, without
      # turning scripts on for everything.
      - name: Rebuild packages that need their install scripts
        if: inputs.rebuild_packages != ''
        env:
          REBUILD_PACKAGES: ${{ inputs.rebuild_packages }}
        run: npm rebuild $REBUILD_PACKAGES

      - name: Apply shared configuration
        run: npm run bootstrap

      # GITHUB_TOKEN cannot push workflow files, so those changes are left to a local bootstrap run.
      - name: Discard workflow file changes
        run: node .github-actions-shared/.github/scripts/utils-update-workflows.js

      # The shared checkout sits inside the caller's working tree, where lint and prettier would
      # read it, so it goes once the workflow discard step has run its script.
      - name: Remove the shared scripts checkout
        run: rm -rf .github-actions-shared

      - name: Detect available scripts
        id: scripts
        run: |
          for script in build lint prettier test; do
            available="$(node -p "Object.hasOwn(require('./package.json').scripts ?? {}, '$script')")"
            echo "$script is available: $available"
            echo "$script=$available" >> "$GITHUB_OUTPUT"
          done

      - name: Build
        if: steps.scripts.outputs.build == 'true'
        run: npm run build

      - name: Lint
        if: steps.scripts.outputs.lint == 'true'
        run: npm run lint

      - name: Prettier
        if: steps.scripts.outputs.prettier == 'true'
        run: npm run prettier

      - name: Test
        if: inputs.run_tests && steps.scripts.outputs.test == 'true'
        run: npm test

      # The shared checkout comes back after the checks so that lint and prettier never see it, and
      # the pull request step lists it in .git/info/exclude so that its commit leaves it out.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/github-actions
          path: .github-actions-shared

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/shared-config-update
          ASSIGNEE: ${{ github.repository_owner }}
        run: |
          echo '.github-actions-shared/' >> .git/info/exclude
          version="$(node -p "require('./node_modules/@sapphire-sh/utils/package.json').version")"
          title="chore: apply @sapphire-sh/utils $version shared configuration"
          body="$(git status --short)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node .github-actions-shared/.github/scripts/npm-audit-fix-publish.js "$BRANCH" "$title" "$ASSIGNEE" <<< "$body"
