name: Shared npm Audit Fix

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: ubuntu-latest
      assignee:
        required: false
        type: string
        default: ''
    secrets:
      PULL_REQUEST_TOKEN:
        required: true

permissions: {}

concurrency:
  group: node-audit-fix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PULL_REQUEST_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Without --force the fixes stay inside the declared dependency ranges. npm audit fix exits
      # non-zero while a vulnerability it could not fix remains, and audit-level none raises that
      # threshold above every severity so those leftovers do not fail the job.
      - name: Apply audit fixes
        run: npm audit fix --ignore-scripts --audit-level=none

      # A run whose update changed nothing skips the fix scripts, so that no pull request opens with
      # formatting fixes alone. continue-on-error keeps a fix script that exits non-zero from stopping
      # the pull request step, which still commits whatever the scripts fixed.
      - name: Apply lint and format fixes
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          status=0
          for script in lint:fix prettier:fix; do
            if SCRIPT="$script" node -e "process.exit(Object.hasOwn(require('./package.json').scripts ?? {}, process.env.SCRIPT) ? 0 : 1)"; then
              npm run "$script" || status=1
            fi
          done
          exit "$status"

      # The pull request step lists the shared checkout in .git/info/exclude so that its commit
      # leaves it out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sapphire-sh/github-actions
          path: .github-actions-shared

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.PULL_REQUEST_TOKEN }}
          BRANCH: chore/npm-audit-fix
          TITLE: 'chore(deps): apply npm audit fix'
          ASSIGNEE: ${{ inputs.assignee }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo '.github-actions-shared/' >> .git/info/exclude
          body="$(node .github-actions-shared/.github/scripts/dependency-summary.js)"
          owner_type="$(gh api "users/$OWNER" --jq .type)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node .github-actions-shared/.github/scripts/pull-request-publish.js "$BRANCH" "$TITLE" "$ASSIGNEE" "$OWNER" "$owner_type" <<< "$body"
