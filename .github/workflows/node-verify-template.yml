name: Shared Node Verify

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: self-hosted

permissions: {}

concurrency:
  group: node-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Detect available scripts
        id: scripts
        run: |
          for script in build lint prettier test; do
            available="$(node -p "Object.hasOwn(require('./package.json').scripts ?? {}, '$script')")"
            echo "$script is available: $available"
            echo "$script=$available" >> "$GITHUB_OUTPUT"
          done
      - name: Build
        if: steps.scripts.outputs.build == 'true'
        run: npm run build
      - name: Lint
        if: steps.scripts.outputs.lint == 'true'
        run: npm run lint
      - name: Prettier
        if: steps.scripts.outputs.prettier == 'true'
        run: npm run prettier
      - name: Test
        if: steps.scripts.outputs.test == 'true'
        run: npm test
