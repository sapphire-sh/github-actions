name: Shared Node Verify

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: self-hosted
      rebuild_packages:
        required: false
        type: string
        default: ''
      working_directory:
        required: false
        type: string
        default: .
      install_directory:
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: node-verify-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working_directory }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ inputs.install_directory || inputs.working_directory }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ inputs.install_directory || inputs.working_directory }}
      # The install above skips lifecycle scripts for the whole dependency tree, which leaves
      # a native addon without the binding file its own install script produces. Listing those
      # package names runs their scripts back, without turning scripts on for every dependency.
      - name: Rebuild packages that need their install scripts
        if: inputs.rebuild_packages != ''
        working-directory: ${{ inputs.install_directory || inputs.working_directory }}
        env:
          REBUILD_PACKAGES: ${{ inputs.rebuild_packages }}
        run: npm rebuild $REBUILD_PACKAGES
      - name: Detect available scripts
        id: scripts
        working-directory: ${{ inputs.working_directory }}
        run: |
          for script in build lint prettier test; do
            available="$(node -p "Object.hasOwn(require('./package.json').scripts ?? {}, '$script')")"
            echo "$script is available: $available"
            echo "$script=$available" >> "$GITHUB_OUTPUT"
          done
      - name: Build
        if: steps.scripts.outputs.build == 'true'
        working-directory: ${{ inputs.working_directory }}
        run: npm run build
      - name: Lint
        if: steps.scripts.outputs.lint == 'true'
        working-directory: ${{ inputs.working_directory }}
        run: npm run lint
      - name: Prettier
        if: steps.scripts.outputs.prettier == 'true'
        working-directory: ${{ inputs.working_directory }}
        run: npm run prettier
      - name: Test
        if: steps.scripts.outputs.test == 'true'
        working-directory: ${{ inputs.working_directory }}
        run: npm test
