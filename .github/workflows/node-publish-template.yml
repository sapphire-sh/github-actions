name: Shared npm Publish

on:
  workflow_call:
    inputs:
      version_bump:
        required: false
        type: string
        default: minor
      release_tag:
        required: false
        type: string
        default: ''
      run_tests:
        required: false
        type: boolean
        default: false
      sonar_scan:
        required: false
        type: boolean
        default: false
      runner:
        required: false
        type: string
        default: self-hosted
    secrets:
      NPM_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: true
      MATTERMOST_TOKEN:
        required: false
      MATTERMOST_CHANNEL_ID:
        required: false
      MATTERMOST_URL:
        required: false
      TAILSCALE_OAUTH_CLIENT_ID:
        required: false
      TAILSCALE_OAUTH_CLIENT_SECRET:
        required: false
      SONAR_TOKEN:
        required: false

permissions: {}

concurrency:
  group: node-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    if: inputs.run_tests || inputs.sonar_scan || github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag != '' && !startsWith(inputs.release_tag, 'v') && format('v{0}', inputs.release_tag) || inputs.release_tag }}
          fetch-depth: ${{ case(inputs.sonar_scan, 0, 1) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Detect available scripts
        id: scripts
        run: |
          for script in build lint prettier test coverage; do
            available="$(node -p "Object.hasOwn(require('./package.json').scripts ?? {}, '$script')")"
            echo "$script is available: $available"
            echo "$script=$available" >> "$GITHUB_OUTPUT"
          done
      - name: Build
        if: steps.scripts.outputs.build == 'true'
        run: npm run build
      - name: Lint
        if: steps.scripts.outputs.lint == 'true'
        run: npm run lint
      - name: Prettier
        if: steps.scripts.outputs.prettier == 'true'
        run: npm run prettier
      - name: Test
        if: steps.scripts.outputs.test == 'true' && !(inputs.sonar_scan && steps.scripts.outputs.coverage == 'true')
        run: npm test
      - name: Coverage
        if: inputs.sonar_scan && steps.scripts.outputs.coverage == 'true'
        run: npm run coverage
      - name: SonarQube Scan
        if: inputs.sonar_scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    needs: [test]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name != 'pull_request'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag != '' && !startsWith(inputs.release_tag, 'v') && format('v{0}', inputs.release_tag) || inputs.release_tag }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: inputs.release_tag == ''
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          case "$VERSION_BUMP" in
            major | minor | patch) ;;
            *)
              npm version "$VERSION_BUMP"
              exit 0
              ;;
          esac
          PACKAGE_NAME=$(npm pkg get name | tr -d '"')
          CURRENT_VERSION=$(npm pkg get version | tr -d '"')
          PUBLISHED_TIME=$(npm view "$PACKAGE_NAME" time --json || echo '{}')
          NEXT_VERSION=$(CURRENT_VERSION="$CURRENT_VERSION" PUBLISHED_TIME="$PUBLISHED_TIME" node -e '
            const published = new Set(Object.keys(JSON.parse(process.env.PUBLISHED_TIME)));
            const version = process.env.CURRENT_VERSION.split(".").map(Number);
            const level = { major: 0, minor: 1, patch: 2 }[process.env.VERSION_BUMP];
            version[level] += 1;
            for (let index = level + 1; index < version.length; index += 1) {
              version[index] = 0;
            }
            while (published.has(version.join("."))) {
              version[2] += 1;
            }
            console.log(version.join("."));
          ')
          npm version "$NEXT_VERSION"

      - name: Push version commit and tag
        if: inputs.release_tag == ''
        run: |
          git push
          git push --tags

      - name: Publish to npm
        run: npm publish --access public --tag latest

      - name: Publish to GitHub Packages
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        run: gh release create --generate-notes "${RELEASE_TAG:-$(git describe --tags)}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag != '' && !startsWith(inputs.release_tag, 'v') && format('v{0}', inputs.release_tag) || inputs.release_tag }}

  notify:
    needs: [test, publish]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-template.yml
    with:
      result: ${{ case(contains(needs.*.result, 'failure'), 'failure', contains(needs.*.result, 'cancelled'), 'cancelled', 'success') }}
      context: ${{ github.repository }}
      job: ${{ github.event_name == 'pull_request' && 'test' || 'publish' }}
      runner: ${{ inputs.runner }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      MATTERMOST_TOKEN: ${{ secrets.MATTERMOST_TOKEN }}
      MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
      MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
