name: Shared Config Update

on:
  workflow_call:
    inputs:
      # Unused. Declared so that a caller still passing it keeps starting.
      run_tests:
        required: false
        type: boolean
        default: false
      runner:
        required: false
        type: string
        default: ubuntu-latest
      # Unused. Declared so that a caller still passing it keeps starting.
      rebuild_packages:
        required: false
        type: string
        default: ''
      assignee:
        required: false
        type: string
        default: ''
    secrets:
      PULL_REQUEST_TOKEN:
        required: true

permissions: {}

concurrency:
  group: node-shared-config-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PULL_REQUEST_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply shared configuration
        run: npm run bootstrap

      - name: Install dependencies bootstrap added
        run: |
          if ! git diff --quiet -- package.json; then
            npm install --ignore-scripts
          fi

      # The pull request step lists the shared checkout in .git/info/exclude so that its commit
      # leaves it out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sapphire-sh/github-actions
          path: .github-actions-shared

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.PULL_REQUEST_TOKEN }}
          BRANCH: chore/shared-config-update
          ASSIGNEE: ${{ inputs.assignee }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo '.github-actions-shared/' >> .git/info/exclude
          version="$(node -p "require('./node_modules/@sapphire-sh/utils/package.json').version")"
          title="chore: apply @sapphire-sh/utils $version shared configuration"
          body="$(node .github-actions-shared/.github/scripts/change-summary.js)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node .github-actions-shared/.github/scripts/pull-request-publish.js "$BRANCH" "$title" "$ASSIGNEE" "$OWNER" <<< "$body"
