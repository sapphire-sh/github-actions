name: Shared Config Update

on:
  workflow_call:
    inputs:
      run_tests:
        required: false
        type: boolean
        default: false
      runner:
        required: false
        type: string
        default: ubuntu-latest
      rebuild_packages:
        required: false
        type: string
        default: ''
    secrets:
      PULL_REQUEST_TOKEN:
        required: true

permissions: {}

concurrency:
  group: node-shared-config-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PULL_REQUEST_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The install above keeps lifecycle scripts off for the whole dependency tree. Listing the
      # packages whose install script produces their binding file runs those scripts back, without
      # turning scripts on for everything.
      - name: Rebuild packages that need their install scripts
        if: inputs.rebuild_packages != ''
        env:
          REBUILD_PACKAGES: ${{ inputs.rebuild_packages }}
        run: npm rebuild $REBUILD_PACKAGES

      - name: Apply shared configuration
        run: npm run bootstrap

      - name: Install dependencies bootstrap added
        env:
          REBUILD_PACKAGES: ${{ inputs.rebuild_packages }}
        run: |
          if ! git diff --quiet -- package.json; then
            npm install --ignore-scripts
            if [ -n "$REBUILD_PACKAGES" ]; then
              npm rebuild $REBUILD_PACKAGES
            fi
          fi

      - name: Detect available scripts
        id: scripts
        run: |
          for script in build lint prettier test; do
            available="$(node -p "Object.hasOwn(require('./package.json').scripts ?? {}, '$script')")"
            echo "$script is available: $available"
            echo "$script=$available" >> "$GITHUB_OUTPUT"
          done

      - name: Build
        if: steps.scripts.outputs.build == 'true'
        run: npm run build

      - name: Lint
        if: steps.scripts.outputs.lint == 'true'
        run: npm run lint

      - name: Prettier
        if: steps.scripts.outputs.prettier == 'true'
        run: npm run prettier

      - name: Test
        if: inputs.run_tests && steps.scripts.outputs.test == 'true'
        run: npm test

      # The shared checkout happens after the checks so that lint and prettier never see it, and
      # the pull request step lists it in .git/info/exclude so that its commit leaves it out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/github-actions
          path: .github-actions-shared

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.PULL_REQUEST_TOKEN }}
          BRANCH: chore/shared-config-update
          ASSIGNEE: ${{ github.repository_owner }}
        run: |
          echo '.github-actions-shared/' >> .git/info/exclude
          version="$(node -p "require('./node_modules/@sapphire-sh/utils/package.json').version")"
          title="chore: apply @sapphire-sh/utils $version shared configuration"
          body="$(node .github-actions-shared/.github/scripts/change-summary.js)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node .github-actions-shared/.github/scripts/pull-request-publish.js "$BRANCH" "$title" "$ASSIGNEE" <<< "$body"
