name: Shared Desktop Publish

on:
  workflow_call:
    inputs:
      assets:
        required: true
        type: string
      working_directory:
        required: false
        type: string
        default: .
      install_directory:
        required: false
        type: string
        default: ''
      runner:
        required: false
        type: string
        default: self-hosted
      rebuild_packages:
        required: false
        type: string
        default: ''
    secrets:
      SLACK_WEBHOOK_URL:
        required: true
      MATTERMOST_TOKEN:
        required: false
      MATTERMOST_CHANNEL_ID:
        required: false
      MATTERMOST_URL:
        required: false
      TAILSCALE_OAUTH_CLIENT_ID:
        required: false
      TAILSCALE_OAUTH_CLIENT_SECRET:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      RELEASE_READ_TOKEN:
        required: false

permissions: {}

concurrency:
  group: desktop-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/node-verify-template.yml
    with:
      runner: ${{ inputs.runner }}
      rebuild_packages: ${{ inputs.rebuild_packages }}
      working_directory: ${{ inputs.working_directory }}
      install_directory: ${{ inputs.install_directory }}

  publish:
    needs: [verify]
    if: github.event_name != 'pull_request'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ inputs.install_directory || inputs.working_directory }}/package-lock.json

      - run: npm ci --ignore-scripts
        working-directory: ${{ inputs.install_directory || inputs.working_directory }}

      # The install above skips lifecycle scripts for the whole dependency tree, which leaves
      # a native addon without the binding file its own install script produces. Listing those
      # package names runs their scripts back, without turning scripts on for every dependency.
      - name: Rebuild packages that need their install scripts
        if: inputs.rebuild_packages != ''
        working-directory: ${{ inputs.install_directory || inputs.working_directory }}
        env:
          REBUILD_PACKAGES: ${{ inputs.rebuild_packages }}
        run: npm rebuild $REBUILD_PACKAGES

      # rustup keeps the toolchain under the runner account's home between runs, so the
      # install script runs only on a host where rustup is missing.
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain none -y
          fi
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal
          "$HOME/.cargo/bin/rustup" default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sapphire-sh/github-actions
          path: .github-actions

      - name: Compute app version
        id: version
        env:
          TAURI_CONFIG: ${{ inputs.working_directory }}/src-tauri/tauri.conf.json
          RUN_NUMBER: ${{ github.run_number }}
        run: node .github-actions/.github/scripts/desktop-build-version.js >> "$GITHUB_OUTPUT"

      - run: npm run tauri build -- --config '{"version":"${{ steps.version.outputs.version }}"}'
        working-directory: ${{ inputs.working_directory }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_READ_TOKEN: ${{ secrets.RELEASE_READ_TOKEN }}

      - name: Recreate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS: ${{ inputs.assets }}
        run: |
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest \
            --target "${{ github.sha }}" \
            --title 'Desktop app (latest)' \
            --notes "Auto-published from ${{ github.sha }}." \
            $ASSETS

      - name: Publish updater manifest
        working-directory: ${{ inputs.working_directory }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          MANIFEST_SCRIPT: ${{ github.workspace }}/.github-actions/.github/scripts/desktop-updater-manifest.js
        run: |
          set -- src-tauri/target/release/bundle/macos/*.app.tar.gz
          if [ ! -f "$1" ]; then
            exit 0
          fi
          gh release upload desktop-latest "$1"
          ASSET_NAME=$(basename "$1")
          ASSET_URL=$(gh api "repos/${{ github.repository }}/releases/tags/desktop-latest" --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .url")
          ASSET_URL="$ASSET_URL" SIGNATURE_FILE="$1.sig" node "$MANIFEST_SCRIPT" > latest.json
          gh release upload desktop-latest latest.json

  notify:
    needs: [verify, publish]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-template.yml
    with:
      result: ${{ case(contains(needs.*.result, 'failure'), 'failure', contains(needs.*.result, 'cancelled'), 'cancelled', 'success') }}
      context: ${{ github.repository }}
      job: ${{ github.event_name == 'pull_request' && 'verify' || 'publish' }}
      runner: ${{ inputs.runner }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      MATTERMOST_TOKEN: ${{ secrets.MATTERMOST_TOKEN }}
      MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
      MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
