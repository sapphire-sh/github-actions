name: Shared utils Update

on:
  workflow_call:
    inputs:
      run_tests:
        required: false
        type: boolean
        default: false
      runner:
        required: false
        type: string
        default: ubuntu-latest
      rebuild_packages:
        required: false
        type: string
        default: ''
      manifests:
        required: false
        type: string
        default: package.json

permissions: {}

concurrency:
  group: utils-update-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      outdated: ${{ steps.resolve.outputs.outdated }}
      latest: ${{ steps.resolve.outputs.latest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/github-actions
          path: .github-actions-shared

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26

      - name: Resolve versions
        id: resolve
        env:
          MANIFESTS: ${{ inputs.manifests }}
        run: |
          latest="$(npm view @sapphire-sh/utils version)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          node .github-actions-shared/.github/scripts/utils-update-manifests.js check "$latest" $MANIFESTS >> "$GITHUB_OUTPUT"

  update:
    needs: [check]
    if: needs.check.outputs.outdated == 'true'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/github-actions
          path: .github-actions-shared

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 26
          cache: npm

      - name: Bump dependency version
        env:
          LATEST: ${{ needs.check.outputs.latest }}
          MANIFESTS: ${{ inputs.manifests }}
        run: node .github-actions-shared/.github/scripts/utils-update-manifests.js bump "$LATEST" $MANIFESTS

      - name: Install dependencies
        env:
          MANIFESTS: ${{ inputs.manifests }}
        run: |
          for manifest in $MANIFESTS; do
            (cd "$(dirname "$manifest")" && npm install --ignore-scripts)
          done

      # This job runs directly on the runner host, so the install above keeps lifecycle scripts
      # off for the whole dependency tree. Listing the packages whose install script produces
      # their binding file runs those scripts back, without turning scripts on for everything.
      - name: Rebuild packages that need their install scripts
        if: inputs.rebuild_packages != ''
        env:
          REBUILD_PACKAGES: ${{ inputs.rebuild_packages }}
        run: npm rebuild $REBUILD_PACKAGES

      - name: Read installed version
        id: installed
        env:
          MANIFESTS: ${{ inputs.manifests }}
        run: node .github-actions-shared/.github/scripts/utils-update-manifests.js installed $MANIFESTS >> "$GITHUB_OUTPUT"

      - name: Check for an existing pull request branch
        id: branch
        env:
          BRANCH: chore/sapphire-utils-${{ steps.installed.outputs.version }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "branch $BRANCH already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply shared configuration
        if: steps.branch.outputs.exists == 'false'
        run: npm run bootstrap

      # GITHUB_TOKEN cannot push workflow files, so those changes are left to a local bootstrap run.
      - name: Discard workflow file changes
        if: steps.branch.outputs.exists == 'false'
        run: node .github-actions-shared/.github/scripts/utils-update-workflows.js

      # The shared checkout sits inside the caller's working tree, where the pull request step's
      # git add would pick it up, so it goes once the workflow discard step has run its script.
      - name: Remove the shared scripts checkout
        if: steps.branch.outputs.exists == 'false'
        run: rm -rf .github-actions-shared

      - name: Detect available scripts
        id: scripts
        if: steps.branch.outputs.exists == 'false'
        run: |
          for script in build lint prettier test; do
            available="$(node -p "Object.hasOwn(require('./package.json').scripts ?? {}, '$script')")"
            echo "$script is available: $available"
            echo "$script=$available" >> "$GITHUB_OUTPUT"
          done

      - name: Build
        if: steps.branch.outputs.exists == 'false' && steps.scripts.outputs.build == 'true'
        run: npm run build

      - name: Lint
        if: steps.branch.outputs.exists == 'false' && steps.scripts.outputs.lint == 'true'
        run: npm run lint

      - name: Prettier
        if: steps.branch.outputs.exists == 'false' && steps.scripts.outputs.prettier == 'true'
        run: npm run prettier

      - name: Test
        if: steps.branch.outputs.exists == 'false' && inputs.run_tests && steps.scripts.outputs.test == 'true'
        run: npm test

      # The shared checkout comes back after the checks so that lint and prettier never see it, and
      # the pull request step removes it again before its git add.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.branch.outputs.exists == 'false'
        with:
          repository: ${{ github.repository_owner }}/github-actions
          path: .github-actions-shared

      - name: Create pull request
        if: steps.branch.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/sapphire-utils-${{ steps.installed.outputs.version }}
          VERSION: ${{ steps.installed.outputs.version }}
          MANIFESTS: ${{ inputs.manifests }}
          ASSIGNEE: ${{ github.repository_owner }}
        run: |
          if git diff --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          body="$(node .github-actions-shared/.github/scripts/dependency-summary.js $MANIFESTS)"
          rm -rf .github-actions-shared
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "chore(deps): bump @sapphire-sh/utils to $VERSION"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore(deps): bump @sapphire-sh/utils to $VERSION" \
            --body "$body" \
            --assignee "$ASSIGNEE"
