name: Shared UserScript Publish

on:
  workflow_call:
    inputs:
      assets:
        required: true
        type: string
      working_directory:
        required: false
        type: string
        default: .
      runner:
        required: false
        type: string
        default: ubuntu-latest
      rebuild_packages:
        required: false
        type: string
        default: ''
    secrets:
      SLACK_WEBHOOK_URL:
        required: true
      MATTERMOST_TOKEN:
        required: false
      MATTERMOST_CHANNEL_ID:
        required: false
      MATTERMOST_URL:
        required: false
      TAILSCALE_OAUTH_CLIENT_ID:
        required: false
      TAILSCALE_OAUTH_CLIENT_SECRET:
        required: false

permissions: {}

concurrency:
  group: userscript-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/node-verify-template.yml
    with:
      runner: ${{ inputs.runner }}
      rebuild_packages: ${{ inputs.rebuild_packages }}

  publish:
    needs: [verify]
    if: github.event_name != 'pull_request'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts

      # The install above skips lifecycle scripts for the whole dependency tree, which leaves
      # a native addon without the binding file its own install script produces. Listing those
      # package names runs their scripts back, without turning scripts on for every dependency.
      - name: Rebuild packages that need their install scripts
        if: inputs.rebuild_packages != ''
        env:
          REBUILD_PACKAGES: ${{ inputs.rebuild_packages }}
        run: npm rebuild $REBUILD_PACKAGES

      - name: Set userscript version
        run: echo "USERSCRIPT_VERSION=$(node -p 'Date.now()')" >> "$GITHUB_ENV"

      - run: npm run build
        working-directory: ${{ inputs.working_directory }}

      - name: Recreate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS: ${{ inputs.assets }}
        run: |
          gh release delete userscript-latest --yes --cleanup-tag || true
          gh release create userscript-latest \
            --target "${{ github.sha }}" \
            --title 'UserScript (latest)' \
            --notes "Auto-published from ${{ github.sha }} (version ${USERSCRIPT_VERSION})." \
            $ASSETS

  notify:
    needs: [verify, publish]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-template.yml
    with:
      result: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
      context: ${{ github.repository }}
      job: ${{ github.event_name == 'pull_request' && 'verify' || 'publish' }}
      runner: ${{ inputs.runner }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      MATTERMOST_TOKEN: ${{ secrets.MATTERMOST_TOKEN }}
      MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
      MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
